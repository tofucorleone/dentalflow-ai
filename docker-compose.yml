services:
  postgres:
    image: postgres:16
    container_name: dentalflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dentalflow_postgres_data:/var/lib/postgresql/data
      - ./packages/database/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dentalflow-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - dentalflow_redis_data:/data

  api:
    build:
      context: ./apps/api
    container_name: dentalflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./storage:/app/storage
      - ./secrets/google/service-account.json:/run/secrets/google-service-account.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  api-test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.test
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    profiles:
      - test
    volumes:
      - ./apps/api/app:/app/app:ro
      - ./apps/api/tests:/app/tests:ro

  appointment-confirmation-worker:
    build:
      context: ./apps/api
    container_name: dentalflow-appointment-confirmation-worker
    restart: unless-stopped
    command:
      - python
      - -m
      - app.appointment_confirmation_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APPOINTMENT_CONFIRMATION_WORKER_INTERVAL_SECONDS: ${APPOINTMENT_CONFIRMATION_WORKER_INTERVAL_SECONDS:-60}
      APPOINTMENT_CONFIRMATION_DISPATCH_LIMIT: ${APPOINTMENT_CONFIRMATION_DISPATCH_LIMIT:-20}
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
    container_name: dentalflow-dashboard
    restart: unless-stopped
    environment:
      INTERNAL_API_URL: http://api:8000
      CLINIC_ID: ${CLINIC_ID}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

volumes:
  dentalflow_postgres_data:
  dentalflow_redis_data:
